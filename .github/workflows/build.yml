name: Bunker build and tests

on:
  push:
    branches: ["codex/bunker-engineering-ci"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bunker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install exact top-level dependencies
        run: |
          if test -f package-lock.json; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: Archive Linux dependencies for the cloud workspace
        run: |
          mkdir -p ci-artifacts
          tar -czf ci-artifacts/dependencies-linux-x64.tar.gz node_modules
          split -b 16M -d --additional-suffix=.part ci-artifacts/dependencies-linux-x64.tar.gz ci-artifacts/deps-
      - uses: actions/upload-artifact@v4
        with:
          name: bunker-deps-00
          path: ci-artifacts/deps-00.part
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('ci-artifacts/deps-01.part') != '' }}
        with:
          name: bunker-deps-01
          path: ci-artifacts/deps-01.part
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('ci-artifacts/deps-02.part') != '' }}
        with:
          name: bunker-deps-02
          path: ci-artifacts/deps-02.part
          compression-level: 0
          retention-days: 7
      - name: Dependency-free engineering checks
        run: npm run test:local
      - name: Simulation and content contracts
        run: npm run test:sim
      - name: Type check and build
        id: build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser acceptance
        run: npm run test:e2e -- --max-failures=1
      - name: Browser failure context
        if: failure()
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in sorted(Path('test-results').rglob('error-context.md')):
              print(f'\n{path}\n{path.read_text()[:16000]}')
          PY
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: bunker-browser-failures
          path: test-results/**/error-context.md
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.build.outcome == 'success' }}
        with:
          name: bunker-hardware-preview
          path: |
            test-results/hardware-*/video.webm
            test-results/hardware-dark.png
            test-results/hardware-restored.png
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.build.outcome == 'success' }}
        with:
          name: bunker-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bunker-lockfile
          path: package-lock.json
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bunker-browser-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.build.outcome == 'success' }}
        with:
          name: bunker-control-preview
          path: |
            test-results/control-room-*/video.webm
            test-results/control-room-arrival.png
            test-results/controller-panel.png
          if-no-files-found: ignore
          retention-days: 14
